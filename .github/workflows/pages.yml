# Publishes website/ → gh-pages branch (no pre-existing Pages "site" required).
# One-time: Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root)
# Live URL: https://dwhforge.github.io/query/
name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy website/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          force_orphan: true
          commit_message: "Deploy DWHForge Query site"
