# Linux + Windows release. DuckDB lib + extensions bundled (no CDN at runtime).
# Artifacts: portable tar.gz / zip (no sudo/admin) + deb + rpm + NSIS.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "true"

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DWHForge Query ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Offline builds (DuckDB + `extensions/` bundled). MIT.

            | Artifact | Notes |
            |----------|--------|
            | **`.tar.gz`** | **Linux** — unpack and `./DWHForge-Query` (no sudo) |
            | **`.zip`** | **Windows** — unpack and `DWHForge-Query.exe` |
            | `.deb` | Debian / Ubuntu (`sudo apt/dpkg -i`) |
            | `.rpm` | RHEL / Rocky / Fedora (`sudo dnf/rpm -i`) |
            | `.exe` (NSIS) | Windows installer |

            Linux portable still needs system WebKitGTK once per machine.
            Windows needs WebView2 (usually preinstalled).
            No DuckDB CDN at runtime.

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (WebKit / Tauri / rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libdbus-1-dev pkg-config \
            curl wget file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: npm ci
        run: npm ci

      - name: Fetch DuckDB extensions (offline bundle)
        run: ./scripts/fetch-duckdb-extensions.sh

      - name: Build engine (pulls prebuilt libduckdb)
        run: cargo build -p dwh-engine --release

      - name: Sync libduckdb.so into src-tauri resources
        run: ./scripts/sync-duckdb-lib.sh

      - name: Sync demo fixtures into src-tauri resources
        run: |
          chmod +x ./scripts/sync-fixtures.sh
          ./scripts/sync-fixtures.sh

      - name: Flatten postgres extension symlink (bundle-safe)
        run: |
          EXT=src-tauri/extensions
          if [[ -L "$EXT/postgres.duckdb_extension" ]]; then
            rm -f "$EXT/postgres.duckdb_extension"
            cp -f "$EXT/postgres_scanner.duckdb_extension" "$EXT/postgres.duckdb_extension"
          fi
          test -f src-tauri/libduckdb.so
          test -f src-tauri/fixtures/sample.csv
          test -f "$EXT/postgres_scanner.duckdb_extension"

      - name: Tauri build (deb + rpm + binary)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # Skip AppImage (linuxdeploy fragile on GHA). tar.gz is the portable path.
          args: --bundles deb,rpm

      - name: Pack portable tar.gz
        run: |
          chmod +x ./scripts/pack-portable-linux.sh
          ./scripts/pack-portable-linux.sh "${GITHUB_REF_NAME}"

      - name: Upload portable tar.gz to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE=$(ls dist-portable/dwhforge-query-*-linux-x86_64.tar.gz | head -1)
          gh release upload "$TAG" "$FILE" --clobber --repo "${{ github.repository }}"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: npm ci
        shell: bash
        run: npm ci

      - name: Fetch DuckDB extensions (offline bundle)
        shell: bash
        run: ./scripts/fetch-duckdb-extensions.sh

      - name: Build engine (pulls prebuilt duckdb.dll)
        shell: bash
        run: cargo build -p dwh-engine --release

      - name: Sync duckdb.dll into src-tauri resources
        shell: bash
        run: ./scripts/sync-duckdb-lib.sh

      - name: Sync demo fixtures into src-tauri resources
        shell: bash
        run: |
          chmod +x ./scripts/sync-fixtures.sh
          ./scripts/sync-fixtures.sh

      - name: Verify Windows resources
        shell: bash
        run: |
          EXT=src-tauri/extensions
          # Ensure postgres alias is a real file (NSIS-safe)
          if [[ ! -f "$EXT/postgres.duckdb_extension" ]]; then
            cp -f "$EXT/postgres_scanner.duckdb_extension" "$EXT/postgres.duckdb_extension"
          fi
          test -f src-tauri/duckdb.dll
          test -f src-tauri/fixtures/sample.csv
          test -f "$EXT/postgres_scanner.duckdb_extension"
          test -f "$EXT/httpfs.duckdb_extension"

      - name: Tauri build (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Pack portable zip
        shell: bash
        run: |
          chmod +x ./scripts/pack-portable-windows.sh
          ./scripts/pack-portable-windows.sh "${GITHUB_REF_NAME}"

      - name: Upload portable zip to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE=$(ls dist-portable/dwhforge-query-*-windows-x86_64.zip | head -1)
          gh release upload "$TAG" "$FILE" --clobber --repo "${{ github.repository }}"
