# Linux release: portable tar.gz (no sudo) + deb + rpm. DuckDB lib + extensions bundled.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"
  NO_STRIP: "true"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (WebKit / Tauri / rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libdbus-1-dev pkg-config \
            curl wget file rpm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: npm ci
        run: npm ci

      - name: Fetch DuckDB extensions (offline bundle)
        run: ./scripts/fetch-duckdb-extensions.sh

      - name: Build engine (pulls prebuilt libduckdb)
        run: cargo build -p dwh-engine --release

      - name: Sync libduckdb.so into src-tauri resources
        run: ./scripts/sync-duckdb-lib.sh

      - name: Flatten postgres extension symlink (bundle-safe)
        run: |
          EXT=src-tauri/extensions
          if [[ -L "$EXT/postgres.duckdb_extension" ]]; then
            rm -f "$EXT/postgres.duckdb_extension"
            cp -f "$EXT/postgres_scanner.duckdb_extension" "$EXT/postgres.duckdb_extension"
          fi
          test -f src-tauri/libduckdb.so
          test -f "$EXT/postgres_scanner.duckdb_extension"

      - name: Tauri build (deb + rpm + binary)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DWHForge Query ${{ github.ref_name }}"
          releaseBody: |
            Offline Linux builds (DuckDB + `extensions/` bundled). MIT.

            | Artifact | Notes |
            |----------|--------|
            | **`.tar.gz`** | **No sudo** — unpack and `./DWHForge-Query` |
            | `.deb` | Debian / Ubuntu (`sudo apt/dpkg -i`) |
            | `.rpm` | RHEL / Rocky / Fedora (`sudo dnf/rpm -i`) |

            Portable tarball still needs system WebKitGTK (once per machine).
            No DuckDB CDN at runtime.
          releaseDraft: false
          prerelease: false
          # Skip AppImage (linuxdeploy fragile on GHA). tar.gz is the portable path.
          args: --bundles deb,rpm

      - name: Pack portable tar.gz
        run: |
          chmod +x ./scripts/pack-portable-linux.sh
          ./scripts/pack-portable-linux.sh "${GITHUB_REF_NAME}"

      - name: Upload portable tar.gz to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE=$(ls dist-portable/dwhforge-query-*-linux-x86_64.tar.gz | head -1)
          # gh may be available on runners; fall back to API upload via curl if needed
          if command -v gh >/dev/null; then
            gh release upload "$TAG" "$FILE" --clobber --repo "${{ github.repository }}"
          else
            curl -sL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @"$FILE" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" | jq -r .id)/assets?name=$(basename "$FILE")"
          fi
