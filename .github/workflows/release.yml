# Electron + dwh-host portable releases (no system WebKitGTK).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DWHForge Query ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Offline builds (DuckDB + `extensions/` bundled). MIT.

            | Artifact | Notes |
            |----------|--------|
            | **`*-electron-linux-x64.tar.gz`** | Linux — unpack, `./DWHForge-Query` (no sudo / no WebKitGTK) |
            | **`*-electron-windows-x64.zip`** | Windows — unpack, `DWHForge-Query.cmd` |

            Linux host linked for **glibc ≥ 2.28** (RHEL 8 / РЕД ОС 7.3+ / Ubuntu 20.04+).
            Chromium via Electron. No DuckDB CDN at runtime.

  linux-electron:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install zig (glibc-aware linker)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Fetch DuckDB extensions
        run: ./scripts/fetch-duckdb-extensions.sh

      - name: Build dwh-host for glibc 2.28+
        run: |
          cargo install cargo-zigbuild --locked
          # Pull prebuilt libduckdb into target/, then zig-link host against glibc 2.28
          cargo build -p dwh-engine --release
          ./scripts/sync-duckdb-lib.sh
          cargo zigbuild -p dwh-host --release --target x86_64-unknown-linux-gnu.2.28
          mkdir -p target/release
          cp -f target/x86_64-unknown-linux-gnu/release/dwh-host target/release/dwh-host
          echo "GLIBC symbols (expect max ≤ 2.28):"
          objdump -T target/release/dwh-host | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -8

      - name: Flatten postgres extension alias
        run: |
          EXT=extensions
          if [[ -L "$EXT/postgres.duckdb_extension" ]]; then
            rm -f "$EXT/postgres.duckdb_extension"
            cp -f "$EXT/postgres_scanner.duckdb_extension" "$EXT/postgres.duckdb_extension"
          fi
          test -f "$EXT/postgres_scanner.duckdb_extension"
          test -f fixtures/sample.csv
          test -x target/release/dwh-host

      - name: Build UI + portable Electron
        run: |
          npm run build
          node scripts/pack-portable-electron.mjs "${GITHUB_REF_NAME}"

      - name: Tar + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR=$(ls -d dist-portable/dwhforge-query-*-electron-linux-x64 | head -1)
          OUT="${DIR}.tar.gz"
          tar -C dist-portable -czf "$OUT" "$(basename "$DIR")"
          gh release upload "$TAG" "$OUT" --clobber --repo "${{ github.repository }}"

  windows-electron:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: npm install
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Fetch DuckDB extensions
        shell: bash
        run: ./scripts/fetch-duckdb-extensions.sh

      - name: Build dwh-host
        shell: bash
        run: |
          cargo build -p dwh-host --release
          ./scripts/sync-duckdb-lib.sh

      - name: Ensure postgres alias is a file
        shell: bash
        run: |
          EXT=extensions
          if [[ ! -f "$EXT/postgres.duckdb_extension" ]]; then
            cp -f "$EXT/postgres_scanner.duckdb_extension" "$EXT/postgres.duckdb_extension"
          fi
          test -f target/release/dwh-host.exe || test -f target/release/dwh-host
          test -f fixtures/sample.csv

      - name: Build UI + portable Electron
        shell: bash
        run: |
          npm run build
          node scripts/pack-portable-electron.mjs "${GITHUB_REF_NAME}"

      - name: Zip + upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR=$(ls -d dist-portable/dwhforge-query-*-electron-windows-x64 | head -1)
          OUT="${DIR}.zip"
          (cd dist-portable && zip -r "$(basename "$OUT")" "$(basename "$DIR")")
          gh release upload "$TAG" "$OUT" --clobber --repo "${{ github.repository }}"
