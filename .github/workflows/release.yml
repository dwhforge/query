# Linux release: deb + rpm (+ AppImage best-effort). DuckDB lib + extensions bundled.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy is an AppImage; runners often lack usable FUSE.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # linuxdeploy's bundled strip dies on modern glibc .relr.dyn sections.
  NO_STRIP: "true"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (WebKit / Tauri / rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libdbus-1-dev pkg-config \
            curl wget file rpm \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: npm ci
        run: npm ci

      - name: Fetch DuckDB extensions (offline bundle)
        run: ./scripts/fetch-duckdb-extensions.sh

      - name: Build engine (pulls prebuilt libduckdb)
        run: cargo build -p dwh-engine --release

      - name: Sync libduckdb.so into src-tauri resources
        run: ./scripts/sync-duckdb-lib.sh

      - name: Flatten postgres extension symlink (bundle-safe)
        run: |
          EXT=src-tauri/extensions
          if [[ -L "$EXT/postgres.duckdb_extension" ]]; then
            rm -f "$EXT/postgres.duckdb_extension"
            cp -f "$EXT/postgres_scanner.duckdb_extension" "$EXT/postgres.duckdb_extension"
          fi
          test -f src-tauri/libduckdb.so
          test -f "$EXT/postgres_scanner.duckdb_extension"
          ls -la src-tauri/libduckdb.so "$EXT"

      # deb + rpm first — reliable on GHA; cover Debian/Ubuntu and RHEL/Fedora/Rocky.
      - name: Tauri build (deb + rpm)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DWHForge Query ${{ github.ref_name }}"
          releaseBody: |
            Offline Linux builds (DuckDB engine + `extensions/` bundled). MIT.

            | Package | Distros |
            |---------|---------|
            | `.deb` | Debian / Ubuntu |
            | `.rpm` | RHEL / Rocky / Alma / Fedora |
            | `.AppImage` | portable (if present) |

            No CDN install at runtime. Optional dbt for Export validate is separate.
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm

      # AppImage is best-effort (linuxdeploy is fragile on hosted runners).
      - name: Tauri build (AppImage)
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DWHForge Query ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles appimage
