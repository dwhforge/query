[package]
name = "dwh-engine"
version.workspace = true
edition.workspace = true
description = "DuckDB session and preview execution for DWH-RS-QUERY"

[[bin]]
name = "dwh-preview"
path = "src/bin/dwh_preview.rs"

[[bin]]
name = "dwh-duckdb-info"
path = "src/bin/dwh_duckdb_info.rs"

[dependencies]
dwh-pipeline = { path = "../dwh-pipeline" }
duckdb = { version = "1.3.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
