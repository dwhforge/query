[package]
name = "dwh-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local JSON-RPC host for DWHForge Query (Electron sidecar)"

[[bin]]
name = "dwh-host"
path = "src/main.rs"

[[bin]]
name = "export-ts-host"
path = "src/bin/export_ts_host.rs"

[dependencies]
dwh-engine = { path = "../dwh-engine" }
dwh-pipeline = { path = "../dwh-pipeline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
ts-rs = { version = "10.1", features = ["serde-compat"] }
