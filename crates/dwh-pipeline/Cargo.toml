[package]
name = "dwh-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TransformationStep AST and CTE SQL compiler for DWH-RS-QUERY"

[[bin]]
name = "dwh-export"
path = "src/bin/dwh_export.rs"

[[bin]]
name = "export-ts"
path = "src/bin/export_ts.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
ts-rs = { version = "10.1", features = ["serde-compat"] }
