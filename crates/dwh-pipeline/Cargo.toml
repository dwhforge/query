[package]
name = "dwh-pipeline"
version.workspace = true
edition.workspace = true
description = "TransformationStep AST and CTE SQL compiler for DWH-RS-QUERY"

[[bin]]
name = "dwh-export"
path = "src/bin/dwh_export.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
