[package]
name = "dwh-rs-query"
version = "0.1.0"
description = "DWH-RS-QUERY local pipeline workbench"
authors = ["dwh-rs-query"]
edition = "2021"

[lib]
name = "dwh_rs_query_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dwh-engine = { path = "../crates/dwh-engine" }
dwh-pipeline = { path = "../crates/dwh-pipeline" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
